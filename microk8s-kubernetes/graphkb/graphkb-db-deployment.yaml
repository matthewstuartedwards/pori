apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose --file ../docker-compose.dev.yml convert
    kompose.version: 1.34.0 (cbf2835db)
  labels:
    io.kompose.service: graphkb-db
  name: db
  namespace: graphkb
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: graphkb-db
  strategy:
    type: Recreate 
  template:
    metadata:
      labels:
        io.kompose.service: graphkb-db
    spec:
      containers:
        - env:
            - name: ORIENTDB_ROOT_PASSWORD
              value: root
          image: orientdb:3.0
          #command: ["server.sh"]
          command: ["/bin/sh", "-c"]
          args: # Make a temp directory for the wal and then launch the server.
            - |
              mkdir /tmp/wal
              export JAVA_OPTS_SCRIPT=-XX:+UseContainerSupport
              export OREINTDB_OPTS_MEMORY="-Xms2G -Xmx2G"
              server.sh -Dlog.file.level=FINE 
          name: graphkb-db
          ports:
            - containerPort: 2424
              protocol: TCP
            - containerPort: 2480
              protocol: TCP
          resources:
            requests:
              memory: "2G"
              cpu: ".25"
            limits:
              memory: "8G"
              cpu: "2"
          volumeMounts:
            - mountPath: /orientdb/databases/
              # Old hostpath method.  Not suitable for snapshotting or graphkb backups though.
              #name: hostpath-graphkb
              name: graphkb-database-storage
      restartPolicy: Always
      
      # Old hostpath volume method that worked for graphkb database purposes, but
      # wasn't suitable for snapshotting or graphkb backup script.
      #volumes: [
      #  {
      #  "name": "hostpath-graphkb",
      #  "hostPath": {
      #    "path": "/orientdb/",
      #    "type": "DirectoryOrCreate"
      #    }
      #  }
      #]

      volumes:
        - name: graphkb-database-storage
          persistentVolumeClaim:
            claimName: graphkb-database-pv-claim